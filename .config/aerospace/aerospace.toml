# Right Command is converted to Cmd+Ctrl+Option by Karabiner and acts as Super.
config-version = 2
start-at-login = true
automatically-unhide-macos-hidden-apps = true
after-login-command = []
after-startup-command = [
  'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-reset.sh"',
]
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 0
default-root-container-layout = 'accordion'
default-root-container-orientation = 'horizontal'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
persistent-workspaces = ['WEB', 'TERM', 'NOTES', 'DOCS', 'CHAT', 'MEDIA', 'UNI', 'ORG', 'MISC']

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[key-mapping]
preset = 'qwerty'

[mode.main.binding]
# km:aerospace.focus.left
ctrl-alt-cmd-h = 'focus left'
# km:aerospace.focus.down
ctrl-alt-cmd-j = 'focus down'
# km:aerospace.focus.up
ctrl-alt-cmd-k = 'focus up'
# km:aerospace.focus.right
ctrl-alt-cmd-l = 'focus right'

# km:aerospace.move.left
ctrl-alt-cmd-shift-h = 'move left'
# km:aerospace.move.down
ctrl-alt-cmd-shift-j = 'move down'
# km:aerospace.move.up
ctrl-alt-cmd-shift-k = 'move up'
# km:aerospace.move.right
ctrl-alt-cmd-shift-l = 'move right'

# km:aerospace.workspace.web
ctrl-alt-cmd-a = 'workspace WEB'
# km:aerospace.workspace.term
ctrl-alt-cmd-s = 'workspace TERM'
# km:aerospace.workspace.notes
ctrl-alt-cmd-d = 'workspace NOTES'
# km:aerospace.workspace.docs
ctrl-alt-cmd-f = 'workspace DOCS'
# km:aerospace.workspace.chat
ctrl-alt-cmd-g = 'workspace CHAT'
# km:aerospace.workspace.media
ctrl-alt-cmd-semicolon = 'workspace MEDIA'
# km:aerospace.workspace.uni
ctrl-alt-cmd-n = 'workspace UNI'
# km:aerospace.workspace.org
ctrl-alt-cmd-comma = 'workspace ORG'
# km:aerospace.workspace.misc
ctrl-alt-cmd-m = 'workspace MISC'

# km:aerospace.window.to-workspace-web
ctrl-alt-cmd-shift-a = 'move-node-to-workspace WEB'
# km:aerospace.window.to-workspace-term
ctrl-alt-cmd-shift-s = 'move-node-to-workspace TERM'
# km:aerospace.window.to-workspace-notes
ctrl-alt-cmd-shift-d = 'move-node-to-workspace NOTES'
# km:aerospace.window.to-workspace-docs
ctrl-alt-cmd-shift-f = 'move-node-to-workspace DOCS'
# km:aerospace.window.to-workspace-chat
ctrl-alt-cmd-shift-g = 'move-node-to-workspace CHAT'
# km:aerospace.window.to-workspace-media
ctrl-alt-cmd-shift-semicolon = 'move-node-to-workspace MEDIA'
# km:aerospace.window.to-workspace-uni
ctrl-alt-cmd-shift-n = 'move-node-to-workspace UNI'
# km:aerospace.window.to-workspace-org
ctrl-alt-cmd-shift-comma = 'move-node-to-workspace ORG'
# km:aerospace.window.to-workspace-misc
ctrl-alt-cmd-shift-m = 'move-node-to-workspace MISC'

# km:aerospace.monitor.focus-next
ctrl-alt-cmd-tab = 'focus-monitor --wrap-around next'
# km:aerospace.monitor.swap-windows
ctrl-alt-cmd-shift-tab = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-swap-monitor-windows.sh"'
# km:aerospace.monitor.move-workspace-next
ctrl-alt-cmd-shift-t = 'move-workspace-to-monitor --wrap-around next'

# km:aerospace.layout.toggle
ctrl-alt-cmd-t = 'layout --root accordion tiles'
# km:aerospace.reset
ctrl-alt-cmd-r = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-reset.sh"'
# km:aerospace.app.terminal
ctrl-alt-cmd-enter = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-home.sh TERM com.mitchellh.ghostty"'
# km:aerospace.app.launcher
ctrl-alt-cmd-space = "exec-and-forget open -a 'Raycast'"
# km:aerospace.app.browser
ctrl-alt-cmd-b = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-home.sh WEB net.imput.helium"'
# km:aerospace.app.notes
ctrl-alt-cmd-o = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-home.sh NOTES notion.id"'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace TERM'

[[on-window-detected]]
if.app-id = 'net.imput.helium'
run = 'move-node-to-workspace WEB'

[[on-window-detected]]
if.app-id = 'com.t3tools.t3code'
run = 'move-node-to-workspace TERM'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace TERM'

[[on-window-detected]]
if = 'test %{app-name} = Codex'
run = 'move-node-to-workspace TERM'

[[on-window-detected]]
if.app-id = 'com.utmapp.UTM'
run = 'move-node-to-workspace TERM'

[[on-window-detected]]
if.app-id = 'com.automattic.beeper.desktop'
run = 'move-node-to-workspace CHAT'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace CHAT'

[[on-window-detected]]
if = 'test %{app-name} = ChatGPT || test %{app-bundle-id} = com.openai.chat'
run = 'move-node-to-workspace CHAT'

[[on-window-detected]]
if.app-id = 'notion.id'
run = 'move-node-to-workspace NOTES'

[[on-window-detected]]
if.app-id = 'info.sioyek.sioyek'
run = 'move-node-to-workspace DOCS'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace MEDIA'

[[on-window-detected]]
if.app-id = 'com.blackmagic-design.DaVinciResolveLite'
run = 'move-node-to-workspace MEDIA'

# Browsers installed on these Macs.
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace WEB'

# Installed WeBeep web app: university material.
[[on-window-detected]]
if.app-id = 'net.imput.helium.app.jkcciickgeobgpkofokhhmpohhachmea'
run = 'move-node-to-workspace UNI'

# Apple terminal and developer console.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.Terminal || test %{app-bundle-id} = com.apple.Console'
run = 'move-node-to-workspace TERM'

# Apple planning and organization apps; Notion remains in NOTES.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.Notes || test %{app-bundle-id} = com.apple.reminders || test %{app-bundle-id} = com.apple.freeform || test %{app-bundle-id} = com.apple.journal || test %{app-bundle-id} = com.apple.iCal'
run = 'move-node-to-workspace ORG'

# Documents, reading, and lightweight writing.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.Preview || test %{app-bundle-id} = com.apple.TextEdit || test %{app-bundle-id} = com.apple.iBooksX || test %{app-bundle-id} = com.apple.Dictionary'
run = 'move-node-to-workspace DOCS'

# Messaging, calls, and email—including the installed Gmail web app.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.mail || test %{app-bundle-id} = com.apple.MobileSMS || test %{app-bundle-id} = com.apple.FaceTime || test %{app-bundle-id} = com.apple.mobilephone || test %{app-bundle-id} = net.imput.helium.app.fmgjjmmmlfnkbppncabfkddbjimcfncm'
run = 'move-node-to-workspace CHAT'

# Music, video, photos, and audio—including the installed SoundCloud web app.
[[on-window-detected]]
if = 'test %{app-bundle-id} = net.imput.helium.app.eikjhbkpemdappjfcmdeeeamdpkgabmk || test %{app-bundle-id} = com.apple.Music || test %{app-bundle-id} = com.apple.podcasts || test %{app-bundle-id} = com.apple.TV || test %{app-bundle-id} = com.apple.Photos || test %{app-bundle-id} = com.apple.QuickTimePlayerX || test %{app-bundle-id} = com.apple.VoiceMemos || test %{app-bundle-id} = com.apple.PhotoBooth'
run = 'move-node-to-workspace MEDIA'

# Small utilities, overlays, and settings windows should not consume the tile tree.
[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.steipete.codexbar'
run = ['layout floating', 'move-node-to-workspace MISC']

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = ['layout floating', 'move-node-to-workspace MISC']

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-EventViewer'
run = ['layout floating', 'move-node-to-workspace MISC']

[[on-window-detected]]
if.app-id = 'com.goodsnooze.MacWhisper'
run = 'layout floating'
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'dev.kdrag0n.MacVirt'
run = ['layout floating', 'move-node-to-workspace MISC']

[[on-window-detected]]
if.app-id = 'ch.protonvpn.mac'
run = ['layout floating', 'move-node-to-workspace MISC']

[[on-window-detected]]
if.app-id = 'com.lihaoyun6.QuickRecorder'
run = ['layout floating', 'move-node-to-workspace MEDIA']

[[on-window-detected]]
if.app-id = 'com.vorssaint.utils'
run = ['layout floating', 'move-node-to-workspace MISC']

[[on-window-detected]]
if.app-id = 'com.electron.wispr-flow'
run = ['layout floating', 'move-node-to-workspace MISC']

[[on-window-detected]]
if.app-id = 'com.kamenlevi.MagHue'
run = ['layout floating', 'move-node-to-workspace MISC']

[[on-window-detected]]
if.app-id = 'com.tonycoco.Picture-In-Picture'
run = ['layout floating', 'move-node-to-workspace MEDIA']

[[on-window-detected]]
if.app-id = 'barinov.calculator.ios'
run = ['layout floating', 'move-node-to-workspace MISC']

[[on-window-detected]]
if.app-id = 'net.raymondhill.uBlock-Origin-Lite'
run = ['layout floating', 'move-node-to-workspace MISC']

[[on-window-detected]]
if.app-id = 'com.sielte.MySielteID'
run = ['layout floating', 'move-node-to-workspace MISC']

[[on-window-detected]]
if.app-id = 'io.tailscale.ipn.macsys'
run = ['layout floating', 'move-node-to-workspace MISC']

# Every regular app without a category lands in one predictable fallback space.
# Earlier matching rules stop callback processing, so this cannot override them.
[[on-window-detected]]
if = 'true'
run = 'move-node-to-workspace MISC'
